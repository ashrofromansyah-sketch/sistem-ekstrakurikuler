<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anggota — SMAEK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #161922; --surface2: #1e2230;
      --border: #252830; --accent: #6c63ff; --accent2: #ff6584;
      --green: #3ecf8e; --yellow: #f9c846; --red: #ff6584;
      --text: #eef0f6; --muted: #7a7f94;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

    /* Sidebar (same as dashboard) */
    .sidebar {
      width: 240px; min-height: 100vh; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 28px 0; position: fixed; top: 0; left: 0; z-index: 10;
    }
    .sidebar-logo { padding: 0 24px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .sidebar-logo .icon { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .sidebar-logo span { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
    .nav { padding: 20px 14px; flex: 1; }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 0 10px; margin-bottom: 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .18s; margin-bottom: 2px; text-decoration: none; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(108,99,255,.15); color: var(--accent); }
    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-user { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: var(--muted); text-transform: capitalize; }
    .btn-logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; transition: color .2s; }
    .btn-logout:hover { color: var(--accent2); }

    /* Main */
    .main { margin-left: 240px; flex: 1; padding: 36px 40px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .page-header h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; }
    .page-header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn { padding: 10px 18px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all .18s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #857aff; }
    .btn-export { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-export:hover { background: var(--surface2); }
    .btn-danger { background: rgba(255,101,132,.15); border: 1px solid rgba(255,101,132,.3); color: var(--accent2); }
    .btn-danger:hover { background: rgba(255,101,132,.25); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    /* Search & filter */
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
    .search-box { flex: 1; position: relative; }
    .search-box input {
      width: 100%; padding: 11px 16px 11px 42px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color .2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; }
    select.filter-sel {
      padding: 11px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; cursor: pointer;
    }
    select.filter-sel:focus { border-color: var(--accent); }

    /* Table */
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; padding: 14px 20px; background: var(--surface2); border-bottom: 1px solid var(--border); text-align: left; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 14px 20px; font-size: 14px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-inti { background: rgba(108,99,255,.15); color: var(--accent); }
    .badge-biasa { background: rgba(62,207,142,.12); color: var(--green); }
    .badge-ya { background: rgba(249,200,70,.12); color: var(--yellow); }
    .badge-tidak { background: rgba(122,127,148,.1); color: var(--muted); }
    .td-actions { display: flex; gap: 8px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 32px; width: 440px; max-width: 95vw;
      transform: translateY(12px); transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 24px; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
    .form-field input, .form-field select {
      width: 100%; padding: 12px 14px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color .2s;
    }
    .form-field input:focus, .form-field select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }

    /* Export dropdown */
    .export-wrap { position: relative; }
    .export-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; min-width: 160px; z-index: 50;
      display: none; box-shadow: 0 12px 32px rgba(0,0,0,.3);
    }
    .export-menu.open { display: block; }
    .export-item { padding: 12px 16px; font-size: 14px; cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 8px; }
    .export-item:hover { background: var(--surface2); }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; right: 28px; z-index: 200;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px; font-size: 14px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3); transform: translateY(20px); opacity: 0;
      transition: all .3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--accent2); }

    .count-label { font-size: 13px; color: var(--muted); }

    /* Role-based hide */
    .admin-only { display: none; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="icon">🎯</div><span>SMAEK</span></div>
    <nav class="nav">
      <div class="nav-label">Menu</div>
      <a class="nav-item" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
      <a class="nav-item active" href="index.html"><span class="icon">👥</span> Anggota</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="avatarEl">A</div>
      <div class="user-info">
        <div class="user-name" id="nameEl">—</div>
        <div class="user-role" id="roleEl">—</div>
      </div>
      <button class="btn-logout" title="Logout" onclick="logout()">⏻</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Data Anggota</h1>
        <p>Kelola seluruh anggota ekstrakurikuler</p>
      </div>
      <div class="header-actions">
        <div class="export-wrap">
          <button class="btn btn-export" onclick="toggleExport()">⬇ Export</button>
          <div class="export-menu" id="exportMenu">
            <div class="export-item" onclick="exportCSV()">📄 Export CSV</div>
            <div class="export-item" onclick="exportJSON()">📦 Export JSON</div>
            <div class="export-item" onclick="printTable()">🖨 Cetak</div>
          </div>
        </div>
        <button class="btn btn-primary admin-only" id="btnTambah" onclick="openModal()">＋ Tambah Anggota</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari nama atau kelas..." oninput="renderTable()"/>
      </div>
      <select class="filter-sel" id="filterJenis" onchange="renderTable()">
        <option value="">Semua Jenis</option>
        <option>Anggota Inti</option>
        <option>Anggota Biasa</option>
      </select>
      <select class="filter-sel" id="filterBonus" onchange="renderTable()">
        <option value="">Semua Bonus</option>
        <option value="Ya">Dapat Bonus</option>
        <option value="Tidak">Tidak Bonus</option>
      </select>
      <span class="count-label" id="countLabel"></span>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Jenis</th>
            <th>Bonus</th>
            <th class="admin-only">Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal Tambah/Edit -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2 id="modalTitle">Tambah Anggota</h2>
      <input type="hidden" id="editId"/>
      <div class="form-field">
        <label>Nama Lengkap</label>
        <input type="text" id="fNama" placeholder="Contoh: Budi Santoso"/>
      </div>
      <div class="form-field">
        <label>Kelas</label>
        <input type="text" id="fKelas" placeholder="Contoh: X-A"/>
      </div>
      <div class="form-field">
        <label>Jenis Anggota</label>
        <select id="fJenis">
          <option>Anggota Inti</option>
          <option>Anggota Biasa</option>
        </select>
      </div>
      <div class="form-field">
        <label>Mendapat Bonus?</label>
        <select id="fBonus">
          <option value="Ya">Ya</option>
          <option value="Tidak">Tidak</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-export" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveAnggota()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // Auth
    const sess = JSON.parse(localStorage.getItem('smaek_session') || 'null');
    if (!sess) location.href = 'login.html';
    document.getElementById('nameEl').textContent = sess?.name || '—';
    document.getElementById('roleEl').textContent = sess?.role || '—';
    document.getElementById('avatarEl').textContent = (sess?.name || 'A')[0].toUpperCase();

    const isAdmin = sess?.role === 'admin';
    if (isAdmin) document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');

    function logout() { localStorage.removeItem('smaek_session'); location.href = 'login.html'; }

    // Data
    function getData() { return JSON.parse(localStorage.getItem('smaek_anggota') || '[]'); }
    function saveData(d) { localStorage.setItem('smaek_anggota', JSON.stringify(d)); }

    // Sample data jika kosong
    if (!getData().length) {
      saveData([
        { id: 1, nama: 'Andi Pratama', kelas: 'X-A', jenis: 'Anggota Inti', bonus: 'Ya' },
        { id: 2, nama: 'Siti Rahayu', kelas: 'X-B', jenis: 'Anggota Biasa', bonus: 'Tidak' },
        { id: 3, nama: 'Budi Santoso', kelas: 'XI-A', jenis: 'Anggota Inti', bonus: 'Ya' },
        { id: 4, nama: 'Dewi Lestari', kelas: 'XI-B', jenis: 'Anggota Biasa', bonus: 'Ya' },
        { id: 5, nama: 'Rizky Firmansyah', kelas: 'XII-A', jenis: 'Anggota Inti', bonus: 'Tidak' },
      ]);
    }

    function renderTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const fj = document.getElementById('filterJenis').value;
      const fb = document.getElementById('filterBonus').value;
      let data = getData().filter(d => {
        const matchQ = d.nama.toLowerCase().includes(q) || d.kelas.toLowerCase().includes(q);
        const matchJ = !fj || d.jenis === fj;
        const matchB = !fb || d.bonus === fb;
        return matchQ && matchJ && matchB;
      });

      document.getElementById('countLabel').textContent = `${data.length} anggota`;

      const tbody = document.getElementById('tableBody');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><p>Tidak ada anggota yang sesuai filter</p></div></td></tr>`;
        return;
      }
      tbody.innerHTML = data.map((d, i) => `
        <tr>
          <td style="color:var(--muted)">${i+1}</td>
          <td><strong>${d.nama}</strong></td>
          <td>${d.kelas}</td>
          <td><span class="badge ${d.jenis === 'Anggota Inti' ? 'badge-inti' : 'badge-biasa'}">${d.jenis}</span></td>
          <td><span class="badge ${d.bonus === 'Ya' ? 'badge-ya' : 'badge-tidak'}">${d.bonus}</span></td>
          <td class="admin-only">
            <div class="td-actions">
              <button class="btn btn-export btn-sm" onclick="editAnggota(${d.id})">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteAnggota(${d.id})">🗑</button>
            </div>
          </td>
        </tr>
      `).join('');
      if (isAdmin) document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
    }

    // Modal
    function openModal(id = null) {
      document.getElementById('modalTitle').textContent = id ? 'Edit Anggota' : 'Tambah Anggota';
      document.getElementById('editId').value = id || '';
      if (id) {
        const d = getData().find(x => x.id === id);
        document.getElementById('fNama').value = d.nama;
        document.getElementById('fKelas').value = d.kelas;
        document.getElementById('fJenis').value = d.jenis;
        document.getElementById('fBonus').value = d.bonus;
      } else {
        document.getElementById('fNama').value = '';
        document.getElementById('fKelas').value = '';
        document.getElementById('fJenis').value = 'Anggota Inti';
        document.getElementById('fBonus').value = 'Ya';
      }
      document.getElementById('modalOverlay').classList.add('open');
    }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
    function closeModalOutside(e) { if (e.target.id === 'modalOverlay') closeModal(); }
    function editAnggota(id) { openModal(id); }

    function saveAnggota() {
      const nama = document.getElementById('fNama').value.trim();
      const kelas = document.getElementById('fKelas').value.trim();
      if (!nama || !kelas) { showToast('Nama dan kelas wajib diisi!', 'error'); return; }
      const jenis = document.getElementById('fJenis').value;
      const bonus = document.getElementById('fBonus').value;
      const editId = parseInt(document.getElementById('editId').value) || null;
      let data = getData();
      if (editId) {
        data = data.map(d => d.id === editId ? { ...d, nama, kelas, jenis, bonus } : d);
        showToast('Anggota berhasil diperbarui ✓', 'success');
      } else {
        const newId = data.length ? Math.max(...data.map(d => d.id)) + 1 : 1;
        data.push({ id: newId, nama, kelas, jenis, bonus });
        showToast('Anggota berhasil ditambahkan ✓', 'success');
      }
      saveData(data);
      closeModal();
      renderTable();
    }

    function deleteAnggota(id) {
      if (!confirm('Yakin ingin menghapus anggota ini?')) return;
      saveData(getData().filter(d => d.id !== id));
      renderTable();
      showToast('Anggota dihapus', 'error');
    }

    // Export
    function toggleExport() { document.getElementById('exportMenu').classList.toggle('open'); }
    document.addEventListener('click', e => { if (!e.target.closest('.export-wrap')) document.getElementById('exportMenu').classList.remove('open'); });

    function exportCSV() {
      const data = getData();
      const rows = [['No','Nama','Kelas','Jenis','Bonus'], ...data.map((d,i) => [i+1, d.nama, d.kelas, d.jenis, d.bonus])];
      const csv = rows.map(r => r.join(',')).join('\n');
      download('anggota.csv', csv, 'text/csv');
      showToast('CSV berhasil diunduh ✓', 'success');
    }
    function exportJSON() {
      download('anggota.json', JSON.stringify(getData(), null, 2), 'application/json');
      showToast('JSON berhasil diunduh ✓', 'success');
    }
    function printTable() { window.print(); }

    function download(filename, content, type) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type }));
      a.download = filename;
      a.click();
    }

    // Toast
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    renderTable();
  </script>
</body>
</html>
