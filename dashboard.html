<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — SMAEK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #161922; --surface2: #1e2230;
      --border: #252830; --accent: #6c63ff; --accent2: #ff6584;
      --green: #3ecf8e; --yellow: #f9c846;
      --text: #eef0f6; --muted: #7a7f94;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

    /* Sidebar */
    .sidebar {
      width: 240px; min-height: 100vh; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 28px 0; position: fixed; top: 0; left: 0; z-index: 10;
    }
    .sidebar-logo { padding: 0 24px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .sidebar-logo .icon { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .sidebar-logo span { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }

    .nav { padding: 20px 14px; flex: 1; }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 0 10px; margin-bottom: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .18s; margin-bottom: 2px; text-decoration: none;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(108,99,255,.15); color: var(--accent); }
    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-user { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: var(--muted); text-transform: capitalize; }
    .btn-logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; transition: color .2s; }
    .btn-logout:hover { color: var(--accent2); }

    /* Main */
    .main { margin-left: 240px; flex: 1; padding: 36px 40px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; }
    .page-header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* Stat cards */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px;
      position: relative; overflow: hidden; transition: transform .2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card .bg-icon { position: absolute; right: -8px; top: -8px; font-size: 70px; opacity: .07; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-card.c1 { border-top: 3px solid var(--accent); }
    .stat-card.c2 { border-top: 3px solid var(--green); }
    .stat-card.c3 { border-top: 3px solid var(--accent2); }
    .stat-card.c4 { border-top: 3px solid var(--yellow); }

    /* Charts row */
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .chart-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 20px; }

    /* Bar chart */
    .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 140px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
    .bar-fill { width: 100%; border-radius: 6px 6px 0 0; min-height: 4px; transition: height .6s ease; }
    .bar-label { font-size: 11px; color: var(--muted); }
    .bar-val { font-size: 12px; font-weight: 600; }

    /* Donut */
    .donut-wrap { display: flex; align-items: center; gap: 24px; }
    .donut-svg { flex-shrink: 0; }
    .donut-legend { display: flex; flex-direction: column; gap: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-name { color: var(--muted); }
    .legend-pct { font-weight: 600; margin-left: auto; }

    /* Recent table */
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .table-title { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
    .btn-link { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; padding: 0 0 12px; border-bottom: 1px solid var(--border); text-align: left; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 14px 0; font-size: 14px; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-inti { background: rgba(108,99,255,.15); color: var(--accent); }
    .badge-biasa { background: rgba(62,207,142,.12); color: var(--green); }
    .badge-bonus { background: rgba(249,200,70,.12); color: var(--yellow); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="icon">🎯</div>
      <span>SMAEK</span>
    </div>
    <nav class="nav">
      <div class="nav-label">Menu</div>
      <a class="nav-item active" href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
      <a class="nav-item" href="index.html"><span class="icon">👥</span> Anggota</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="avatarEl">A</div>
      <div class="user-info">
        <div class="user-name" id="nameEl">—</div>
        <div class="user-role" id="roleEl">—</div>
      </div>
      <button class="btn-logout" title="Logout" onclick="logout()">⏻</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1>Dashboard</h1>
      <p id="greetEl">Selamat datang kembali!</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card c1">
        <div class="bg-icon">👥</div>
        <div class="stat-label">Total Anggota</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-sub">terdaftar</div>
      </div>
      <div class="stat-card c2">
        <div class="bg-icon">⭐</div>
        <div class="stat-label">Anggota Inti</div>
        <div class="stat-value" id="statInti">0</div>
        <div class="stat-sub">orang</div>
      </div>
      <div class="stat-card c3">
        <div class="bg-icon">👤</div>
        <div class="stat-label">Anggota Biasa</div>
        <div class="stat-value" id="statBiasa">0</div>
        <div class="stat-sub">orang</div>
      </div>
      <div class="stat-card c4">
        <div class="bg-icon">🏅</div>
        <div class="stat-label">Dapat Bonus</div>
        <div class="stat-value" id="statBonus">0</div>
        <div class="stat-sub">orang</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Anggota per Kelas</div>
        <div class="bar-chart" id="barChart"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Komposisi Jenis</div>
        <div class="donut-wrap">
          <svg class="donut-svg" width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="48" fill="none" stroke="var(--surface2)" stroke-width="20"/>
            <circle id="donutInti" cx="60" cy="60" r="48" fill="none" stroke="var(--accent)" stroke-width="20"
              stroke-dasharray="0 302" stroke-linecap="round" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .8s ease"/>
            <circle id="donutBiasa" cx="60" cy="60" r="48" fill="none" stroke="var(--green)" stroke-width="20"
              stroke-dasharray="0 302" stroke-linecap="round" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .8s ease"/>
            <text x="60" y="55" text-anchor="middle" fill="var(--text)" font-family="Syne,sans-serif" font-size="18" font-weight="800" id="donutCenter">0</text>
            <text x="60" y="70" text-anchor="middle" fill="var(--muted)" font-size="10">total</text>
          </svg>
          <div class="donut-legend">
            <div class="legend-item">
              <div class="legend-dot" style="background:var(--accent)"></div>
              <span class="legend-name">Inti</span>
              <span class="legend-pct" id="pctInti">0%</span>
            </div>
            <div class="legend-item">
              <div class="legend-dot" style="background:var(--green)"></div>
              <span class="legend-name">Biasa</span>
              <span class="legend-pct" id="pctBiasa">0%</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <div class="table-title">Anggota Terbaru</div>
        <button class="btn-link" onclick="location.href='index.html'">Lihat Semua →</button>
      </div>
      <table>
        <thead>
          <tr><th>Nama</th><th>Kelas</th><th>Jenis</th><th>Bonus</th></tr>
        </thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    // Auth guard
    const sess = JSON.parse(localStorage.getItem('smaek_session') || 'null');
    if (!sess) location.href = 'login.html';

    document.getElementById('nameEl').textContent = sess?.name || '—';
    document.getElementById('roleEl').textContent = sess?.role || '—';
    document.getElementById('avatarEl').textContent = (sess?.name || 'A')[0].toUpperCase();
    document.getElementById('greetEl').textContent = `Selamat datang, ${sess?.name}!`;

    function logout() { localStorage.removeItem('smaek_session'); location.href = 'login.html'; }

    function getData() { return JSON.parse(localStorage.getItem('smaek_anggota') || '[]'); }

    function render() {
      const data = getData();
      const inti = data.filter(d => d.jenis === 'Anggota Inti');
      const biasa = data.filter(d => d.jenis === 'Anggota Biasa');
      const bonus = data.filter(d => d.bonus === 'Ya');

      document.getElementById('statTotal').textContent = data.length;
      document.getElementById('statInti').textContent = inti.length;
      document.getElementById('statBiasa').textContent = biasa.length;
      document.getElementById('statBonus').textContent = bonus.length;

      // donut
      const circ = 2 * Math.PI * 48;
      const pI = data.length ? inti.length / data.length : 0;
      const pB = data.length ? biasa.length / data.length : 0;
      const intiDash = pI * circ;
      const biasaDash = pB * circ;
      document.getElementById('donutInti').setAttribute('stroke-dasharray', `${intiDash} ${circ - intiDash}`);
      const intiOffset = -(pI * circ);
      document.getElementById('donutBiasa').setAttribute('stroke-dasharray', `${biasaDash} ${circ - biasaDash}`);
      document.getElementById('donutBiasa').style.strokeDashoffset = intiOffset;
      document.getElementById('donutCenter').textContent = data.length;
      document.getElementById('pctInti').textContent = data.length ? Math.round(pI*100)+'%' : '0%';
      document.getElementById('pctBiasa').textContent = data.length ? Math.round(pB*100)+'%' : '0%';

      // bar chart by class
      const kelasMap = {};
      data.forEach(d => { kelasMap[d.kelas] = (kelasMap[d.kelas] || 0) + 1; });
      const kelasList = Object.entries(kelasMap).sort((a,b) => b[1]-a[1]).slice(0, 6);
      const maxVal = Math.max(...kelasList.map(k => k[1]), 1);
      const colors = ['var(--accent)', 'var(--green)', 'var(--accent2)', 'var(--yellow)', '#00d2ff', '#ff9f43'];
      const barEl = document.getElementById('barChart');
      barEl.innerHTML = kelasList.length ? kelasList.map(([kls, val], i) => `
        <div class="bar-wrap">
          <div class="bar-val">${val}</div>
          <div style="flex:1;display:flex;align-items:flex-end;width:100%">
            <div class="bar-fill" style="background:${colors[i%colors.length]};height:${Math.round((val/maxVal)*100)}%"></div>
          </div>
          <div class="bar-label">${kls}</div>
        </div>
      `).join('') : '<p style="color:var(--muted);font-size:13px">Belum ada data</p>';

      // recent
      const recent = [...data].reverse().slice(0, 5);
      document.getElementById('recentBody').innerHTML = recent.length ? recent.map(d => `
        <tr>
          <td><strong>${d.nama}</strong></td>
          <td>${d.kelas}</td>
          <td><span class="badge badge-${d.jenis === 'Anggota Inti' ? 'inti' : 'biasa'}">${d.jenis}</span></td>
          <td><span class="badge badge-${d.bonus === 'Ya' ? 'bonus' : 'biasa'}">${d.bonus}</span></td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="color:var(--muted);text-align:center;padding:20px">Belum ada anggota</td></tr>';
    }

    render();
  </script>
</body>
</html>
